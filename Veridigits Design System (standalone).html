  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

       #2563EB;\n  --info-soft:   #E5EDFD;\n\n  /* — Radii — */\n  --r-xs: 4px;\n  --r-sm: 6px;\n  --r-md: 10px;\n  --r-lg: 14px;\n  --r-xl: 20px;\n  --r-2xl: 28px;\n  --r-full: 999px;\n\n  /* — Shadows (warm-tinted) — */\n  --sh-xs:  0 1px 0 rgba(20,17,12,.04);\n  --sh-sm:  0 1px 2px rgba(20,17,12,.06), 0 1px 0 rgba(20,17,12,.03);\n  --sh-md:  0 4px 12px -4px rgba(20,17,12,.08), 0 2px 4px -2px rgba(20,17,12,.05);\n  --sh-lg:  0 16px 40px -12px rgba(20,17,12,.12), 0 4px 12px -4px rgba(20,17,12,.06);\n  --sh-card: 0 1px 0 rgba(20,17,12,.04), 0 1px 2px rgba(20,17,12,.04);\n  --sh-glow: 0 0 0 4px rgba(0, 196, 106, .14);\n\n  /* — Type families — */\n  --font-sans: \"Aeonik\", \"General Sans\", ui-sans-serif, system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif;\n  --font-mono: \"JetBrains Mono\", ui-monospace, SFMono-Regular, Menlo, monospace;\n\n  /* — Motion — */\n  --ease-out: cubic-bezier(.2,.8,.2,1);\n  --ease-in:  cubic-bezier(.6,.04,.98,.34);\n  --dur-fast: 120ms;\n  --dur-base: 200ms;\n  --dur-slow: 360ms;\n}\n\n/* ============================================================\n   RESET & BASE\n============================================================ */\n*, *::before, *::after { box-sizing: border-box; }\nhtml, body { margin: 0; padding: 0; }\nbody {\n  background: var(--paper);\n  color: var(--ink);\n  font-family: var(--font-sans);\n  font-size: 16px;\n  line-height: 1.55;\n  font-feature-settings: \"ss01\", \"cv11\";\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\nimg, svg { display: block; max-width: 100%; }\na { color: inherit; text-decoration: none; }\nbutton { font: inherit; cursor: pointer; }\n\n/* ============================================================\n   PAGE FRAME\n============================================================ */\n.page {\n  max-width: 1280px;\n  margin: 0 auto;\n  padding: 0 56px;\n}\n@media (max-width: 760px) {\n  .page { padding: 0 24px; }\n}\n\n/* Top bar */\n.topbar {\n  position: sticky; top: 0; z-index: 50;\n  background: color-mix(in oklab, var(--paper) 88%, transparent);\n  backdrop-filter: saturate(140%) blur(8px);\n  border-bottom: 1px solid var(--border);\n}\n.topbar-inner {\n  display: flex; align-items: center; justify-content: space-between;\n  height: 64px;\n}\n.topbar nav { display: flex; gap: 28px; }\n.topbar nav a {\n  font-size: 14px; color: var(--ink-muted); font-weight: 500;\n  transition: color var(--dur-fast) var(--ease-out);\n}\n.topbar nav a:hover { color: var(--ink); }\n.topbar .meta {\n  font-family: var(--font-mono); font-size: 12px; color: var(--ink-subtle);\n}\n\n/* ============================================================\n   LOGO\n============================================================ */\n.logo {\n  display: inline-flex; align-items: center; gap: 10px;\n  font-family: var(--font-sans);\n  font-weight: 600;\n  font-size: 19px;\n  letter-spacing: -0.012em;\n  color: var(--ink);\n}\n.logo .mark {\n  width: 26px; height: 26px;\n  display: grid; place-items: center;\n  background: var(--ink);\n  color: var(--vg-500);\n  border-radius: 6px;\n  font-family: var(--font-mono);\n  font-size: 13px;\n  font-weight: 600;\n  letter-spacing: -0.04em;\n}\n.logo .dot { color: var(--vg-500); }\n\n/* ============================================================\n   TYPE\n============================================================ */\n.display, .h1, .h2, .h3, .h4 {\n  font-family: var(--font-sans);\n  letter-spacing: -0.022em;\n  color: var(--ink);\n  margin: 0;\n  text-wrap: balance;\n}\n.display { font-size: clamp(48px, 6vw, 80px); line-height: 1.02; font-weight: 600; letter-spacing: -0.035em; }\n.h1 { font-size: clamp(36px, 4vw, 52px); line-height: 1.05; font-weight: 600; letter-spacing: -0.028em; }\n.h2 { font-size: 36px; line-height: 1.1; font-weight: 600; letter-spacing: -0.022em; }\n.h3 { font-size: 24px; line-height: 1.2; font-weight: 600; letter-spacing: -0.014em; }\n.h4 { font-size: 18px; line-height: 1.3; font-weight: 600; letter-spacing: -0.008em; }\n.body  { font-size: 16px; line-height: 1.55; color: var(--ink-2); }\n.body-lg { font-size: 19px; line-height: 1.55; color: var(--ink-2); text-wrap: pretty; }\n.small { font-size: 14px; line-height: 1.5; color: var(--ink-muted); }\n.caption { font-size: 13px; line-height: 1.45; color: var(--ink-muted); }\n.eyebrow {\n  font-family: var(--font-mono);\n  font-size: 12px; font-weight: 500;\n  text-transform: uppercase;\n  letter-spacing: 0.10em;\n  color: var(--ink-muted);\n}\n.mono { font-family: var(--font-mono); }\n\n/* ============================================================\n   SECTION FRAME\n============================================================ */\n.section { padding: 96px 0; border-top: 1px solid var(--border); }\n.section:first-of-type { border-top: 0; }\n.section-head { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 48px; }\n.section-head .left { max-width: 720px; }\n.section-head .eyebrow + .h2 { margin-top: 12px; }\n.section-head .h2 + .body { margin-top: 14px; }\n\n/* ============================================================\n   HERO  —  inspired by dogesms.com\n============================================================ */\n.hero { padding: 96px 0 120px; position: relative; }\n.hero-grid {\n  display: grid;\n  grid-template-columns: 1.2fr 1fr;\n  gap: 80px;\n  align-items: center;\n}\n@media (max-width: 900px) {\n  .hero-grid { grid-template-columns: 1fr; gap: 56px; }\n}\n.hero h1 {\n  font-size: clamp(56px, 7vw, 96px);\n  line-height: 0.98;\n  letter-spacing: -0.04em;\n  font-weight: 600;\n  margin: 18px 0 24px;\n}\n.hero h1 .accent {\n  display: inline-block;\n  position: relative;\n}\n.hero h1 .accent::after {\n  content: \"\";\n  position: absolute;\n  left: -2px; right: -2px; bottom: 4px;\n  height: 14px;\n  background: var(--vg-500);\n  z-index: -1;\n  border-radius: 2px;\n  opacity: 0.95;\n}\n.hero p.lead {\n  font-size: 19px;\n  line-height: 1.55;\n  color: var(--ink-2);\n  max-width: 480px;\n  margin: 0 0 36px;\n}\n.hero-cta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }\n.hero-stats {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 0;\n  margin-top: 64px;\n  border-top: 1px solid var(--border);\n  padding-top: 32px;\n}\n.hero-stats .stat { padding-right: 24px; border-right: 1px solid var(--border); }\n.hero-stats .stat:last-child { border-right: 0; }\n.hero-stats .num {\n  font-family: var(--font-mono);\n  font-size: 36px;\n  font-weight: 500;\n  letter-spacing: -0.03em;\n  color: var(--ink);\n  line-height: 1;\n}\n.hero-stats .lbl {\n  font-size: 13px;\n  color: var(--ink-muted);\n  margin-top: 8px;\n  letter-spacing: 0.01em;\n}\n\n/* — Phone mockup — */\n.phone-stage {\n  position: relative;\n  display: grid;\n  place-items: center;\n  min-height: 620px;\n}\n.phone-stage::before {\n  /* soft halo behind phone */\n  content: \"\"; position: absolute; inset: 0;\n  background: radial-gradient(60% 50% at 60% 50%, rgba(0,196,106,.12), transparent 70%);\n  z-index: 0;\n}\n.phone {\n  position: relative; z-index: 1;\n  width: 320px;\n  background: #14110C;\n  border-radius: 44px;\n  padding: 12px;\n  box-shadow:\n    0 60px 80px -40px rgba(20,17,12,.35),\n    0 24px 40px -20px rgba(20,17,12,.18),\n    inset 0 0 0 1px rgba(255,255,255,.04);\n}\n.phone-screen {\n  background: var(--paper);\n  border-radius: 32px;\n  padding: 14px 0 0;\n  height: 600px;\n  overflow: hidden;\n  position: relative;\n}\n.phone-statusbar {\n  display: flex; justify-content: space-between; align-items: center;\n  padding: 4px 24px 14px;\n  font-size: 14px; font-weight: 600;\n  font-family: var(--font-mono);\n  color: var(--ink);\n}\n.phone-statusbar .right { display: flex; gap: 6px; align-items: center; opacity: .9; }\n.phone-notch {\n  position: absolute; top: 8px; left: 50%; transform: translateX(-50%);\n  width: 92px; height: 26px; background: #14110C; border-radius: 16px;\n}\n.phone-content { padding: 8px 16px 16px; }\n.phone-card-active {\n  background: var(--ink);\n  color: var(--paper);\n  border-radius: 20px;\n  padding: 16px 18px;\n  display: flex; align-items: center; justify-content: space-between;\n  margin-bottom: 14px;\n}\n.phone-card-active .label {\n  font-family: var(--font-mono);\n  font-size: 11px;\n  text-transform: uppercase;\n  letter-spacing: 0.08em;\n  color: var(--vg-300);\n}\n.phone-card-active .code {\n  font-family: var(--font-mono);\n  font-size: 28px;\n  font-weight: 500;\n  letter-spacing: 0.02em;\n  margin-top: 4px;\n}\n.phone-card-active .timer {\n  font-family: var(--font-mono);\n  font-size: 22px;\n  font-weight: 500;\n  color: var(--vg-300);\n  letter-spacing: 0.02em;\n}\n.phone-card-active .timer-lbl {\n  font-size: 10px; color: var(--ink-subtle);\n  text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 2px;\n  text-align: right;\n}\n.msg-list-head {\n  display: flex; justify-content: space-between; align-items: center;\n  padding: 10px 4px 8px;\n}\n.msg-list-head .ttl { font-weight: 600; font-size: 14px; }\n.msg-list-head .cnt {\n  font-family: var(--font-mono);\n  font-size: 12px;\n  color: var(--ink-muted);\n  background: var(--subtle);\n  padding: 2px 8px; border-radius: var(--r-full);\n}\n.sms-row {\n  display: flex; gap: 12px; align-items: flex-start;\n  padding: 12px 4px;\n  border-top: 1px solid var(--quiet);\n  position: relative;\n}\n.sms-row .ico {\n  width: 32px; height: 32px; border-radius: 8px;\n  display: grid; place-items: center; flex-shrink: 0;\n  font-family: var(--font-mono); font-size: 13px; font-weight: 600;\n}\n.sms-row .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }\n.sms-row .name { font-weight: 600; font-size: 14px; }\n.sms-row .ago { font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted); }\n.sms-row .body { font-size: 13px; color: var(--ink-2); margin-top: 2px; line-height: 1.4; }\n.sms-row .body code {\n  font-family: var(--font-mo ms;\n}\n.wallet .bal .cents { color: var(--ink-subtle); }\n.wallet .bal .cur { color: var(--vg-300); margin-right: 8px; font-size: 28px; vertical-align: top; line-height: 1.5; font-weight: 500; }\n.wallet .meta { display: flex; gap: 24px; margin-top: 24px; }\n.wallet .meta div { font-size: 13px; color: var(--ink-subtle); }\n.wallet .meta div b { display: block; color: var(--paper); font-family: var(--font-mono); font-size: 16px; margin-top: 4px; font-weight: 500; }\n.wallet .actions { position: relative; z-index: 2; display: flex; gap: 10px; margin-top: 24px; }\n.wallet .btn-on-dark { background: rgba(255,255,255,.10); color: var(--paper); border: 1px solid rgba(255,255,255,.14); }\n.wallet .btn-on-dark:hover { background: rgba(255,255,255,.16); }\n.wallet .btn-accent { background: var(--vg-500); color: var(--ink); }\n\n/* Service tile */\n.svc-grid {\n  display: grid; gap: 12px;\n  grid-template-columns: repeat(4, 1fr);\n}\n@media (max-width: 760px) { .svc-grid { grid-template-columns: repeat(2, 1fr); } }\n.svc-tile {\n  display: flex; align-items: center; gap: 12px;\n  padding: 14px; background: var(--surface);\n  border: 1px solid var(--border); border-radius: var(--r-md);\n  cursor: pointer;\n  transition: border-color var(--dur-fast), box-shadow var(--dur-fast), background var(--dur-fast);\n}\n.svc-tile:hover { border-color: var(--ink); box-shadow: var(--sh-sm); }\n.svc-tile.selected { border-color: var(--ink); box-shadow: var(--sh-glow); }\n.svc-tile .ico {\n  width: 36px; height: 36px; border-radius: var(--r-sm);\n  display: grid; place-items: center;\n  font-family: var(--font-mono); font-weight: 600; font-size: 13px;\n  flex-shrink: 0;\n}\n.svc-tile .nm { font-weight: 500; font-size: 14px; color: var(--ink); }\n.svc-tile .pr { font-family: var(--font-mono); font-size: 12px; color: var(--ink-muted); }\n\n/* Country row */\n.cty-list { display: grid; gap: 4px; max-height: 320px; overflow: auto; padding-right: 4px; }\n.cty-row {\n  display: grid;\n  grid-templ  var(--ink); color: var(--paper);\n  padding: 28px;\n  border-radius: var(--r-lg);\n  text-align: center;\n  position: relative;\n}\n.otp-reveal .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--ink-subtle); text-transform: uppercase; letter-spacing: 0.12em; }\n.otp-reveal .code {\n  font-family: var(--font-mono); font-size: 56px; font-weight: 500;\n  letter-spacing: 0.18em; margin: 12px 0 8px;\n  color: var(--vg-300);\n  font-variant-numeric: tabular-nums;\n}\n.otp-reveal .src { font-size: 13px; color: var(--ink-subtle); }\n.otp-reveal .copy {\n  position: absolute; top: 14px; right: 14px;\n  background: rgba(255,255,255,.10); color: var(--paper);\n  border: 1px solid rgba(255,255,255,.14);\n  padding: 6px 10px; border-radius: var(--r-sm);\n  font-family: var(--font-mono); font-size: 11px; cursor: pointer;\n}\n\n/* SMS bubble */\n.sms-bubble {\n  display: grid; grid-template-columns: 36px 1fr auto;\n  gap: 12px; padding: 14px 16px;\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--r-lg);\n}\n.sms-bubble .av {\n  width: 36px; height: 36px; border-radius: var(--r-sm);\n  display: grid; place-items: center;\n  font-family: var(--font-mono); font-size: 13px; font-weight: 600;\n}\n.sms-bubble .who { font-weight: 600; font-size: 14px; }\n.sms-bubble .when { font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted); }\n.sms-bubble .msg { font-size: 14px; color: var(--ink-2); margin-top: 4px; line-height: 1.45; }\n.sms-bubble .msg code {\n  font-family: var(--font-mono); background: var(--vg-50);\n  color: var(--vg-700); padding: 1px 6px; border-radius: 4px;\n}\n\n/* Top-up tile */\n.topup-grid {\n  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;\n}\n@media (max-width: 760px) { .topup-grid { grid-template-columns: repeat(2, 1fr); } }\n.topup-tile {\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--r-md);\n  padding: 18px;\n  text-align: center;\n  cursor: pointer;\n  transition: border-color var(--dur-fast), box-shadow var(--dur-fast);\n}\n.topup-tile:hover { border-color: var(--ink); }\n.topup-tile.selected {\n  border-color: var(--ink); background: var(--ink); color: var(--paper);\n}\n.topup-tile.selected .lbl { color: var(--ink-subtle); }\n.topup-tile .lbl { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-muted); }\n.topup-tile .amt { font-family: var(--font-mono); font-size: 24px; font-weight: 500; margin-top: 6px; font-variant-numeric: tabular-nums; }\n\n/* Chip group (crypto) */\n.chips { display: flex; gap: 8px; flex-wrap: wrap; }\n.chip {\n  display: inline-flex; align-items: center; gap: 8px;\n  padding: 8px 12px;\n  background: var(--surface);\n  border: 1px solid var(--border-strong);\n  border-radius: var(--r-full);\n  font-size: 13px; font-weight: 500; color: var(--ink-2);\n  cursor: pointer;\n}\n.chip.selected { background: var(--ink); color: var(--paper); border-color: var(--ink); }\n.chip .tic {\n  width: 16px; height: 16px; border-radius: 50%;\n  background: var(--subtle);\n  display: grid; place-items: center;\n  font-family: var(--font-mono); font-size: 9px; color: var(--ink-muted);\n}\n.chip.selected .tic { background: var(--vg-500); color: var(--ink); }\n\n/* Status row helper */\n.dotline { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-muted); }\n.dotline .d { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-subtle); }\n.dotline.ok .d { background: var(--vg-500); }\n.dotline.warn .d { background: var(--warn); }\n.dotline.danger .d { background: var(--danger); }\n\n/* ============================================================\n   PAGE TEMPLATES (mock frames)\n============================================================ */\n.frame {\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--r-xl);\n  overflow: hidden;\n  box-shadow: var(--sh-card);\n}\n.frame > .chrome {\n  display: flex; align-items: center; gap: 8px;\n  padding: 12px 16px;\n  background: var(--subtle);\n  border-bottom: 1px solid var(--border);\n  font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted);\n}\n.frame > .chrome .lights { display: flex; gap: 6px; }\n.frame > .chrome .lights i {\n  width: 10px; height: 10px; border-radius: 50%; background: var(--quiet);\n}\n.frame > .chrome .url {\n  flex: 1; text-align: center;\n  background: var(--surface); padding: 4px 12px; border-radius: var(--r-full);\n  border: 1px solid var(--border);\n}\n\n/* Dashboard layout */\n.dash {\n  display: grid;\n  grid-template-columns: 220px 1fr;\n  min-height: 600px;\n}\n.dash .side {\n  border-right: 1px solid var(--border);\n  padding: 24px 16px;\n  background: var(--paper);\n}\n.dash .side .logo { margin-bottom: 28px; padding: 0 8px; }\n.dash .side nav { display: flex; flex-direction: column; gap: 2px; }\n.dash .side nav a {\n  display: flex; align-items: center; justify-content: space-between;\n  padding: 8px 12px; border-radius: var(--r-sm);\n  font-size: 14px; color: var(--ink-2);\n}\n.dash .side nav a:hover { background: var(--subtle); }\n.dash .side nav a.active { background: var(--ink); color: var(--paper); }\n.dash .side nav a .k { font-family: var(--font-mono); font-size: 11px; color: var(--ink-subtle); }\n.dash .side nav a.active .k { color: var(--vg-300); }\n.dash .side .group {\n  margin-top: 24px;\n  font-family: var(--font-mono); font-size: 11px;\n  text-transform: uppercase; letter-spacing: 0.10em;\n  color: var(--ink-subtle); padding: 0 12px 8px;\n}\n.dash .main { padding: 32px; background: var(--paper); }\n.dash .main .pageh { display: flex; justify-content: space-between; align-items: end; margin-bottom: 24px; }\n.dash .main .pageh .h2 { font-size: 28px; }\n\n/* simple grid helpers in templates */\n.g-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }\n.g-3 { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }\n@media (max-width: 900px) { .g-2, .g-3 { grid-template-columns: 1fr; } }\n\n/* code block */\npre.code {\n  background: var(--ink);\n  color: #DDD7C8;\n  padding: 22px 24px;\n  border-radius: var(--r-lg);\n  overflow: auto;\n  font-family: var(--font-mono);\n  font-size: 13px;\n  line-height: 1.6;\n  margin: 0;\n}\npre.code .k { color: #FF9472; }\npre.code .s { color: var(--vg-300); }\npre.code .c { color: #7C7666; font-style: italic; }\npre.code .n { color: #E8C570; }\npre.code .v { color: #AECBFA; }\n\n/* misc */\n.divider { height: 1px; background: var(--border); margin: 16px 0; }\n.kbd {\n  display: inline-grid; place-items: center;\n  min-width: 22px; height: 22px; padding: 0 6px;\n  background: var(--surface); border: 1px solid var(--border-strong);\n  border-bottom-width: 2px; border-radius: var(--r-xs);\n  font-family: var(--font-mono); font-size: 11px; color: var(--ink-2);\n}\n\n/* footer */\n.foot {\n  border-top: 1px solid var(--border);\n  padding: 48px 0;\n  font-size: 13px; color: var(--ink-muted);\n  display: flex; justify-content: space-between; align-items: center;\n}\n\n/* hide scrollbar bling */\n.cty-list::-webkit-scrollbar { width: 6px; }\n.cty-list::-webkit-scrollbar-thumb { background: var(--quiet); border-radius: 3px; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<!-- ============================================================\n     TOPBAR\n============================================================ -->\n<header class=\"topbar\">\n  <div class=\"page topbar-inner\">\n    <a class=\"logo\" href=\"#\">\n      <span class=\"mark\">v.<\u002Fspan>\n      <span>veridigits<span class=\"dot\">.<\u002Fspan><\u002Fspan>\n    <\u002Fa>\n    <nav>\n      <a href=\"#brand\">Brand<\u002Fa>\n      <a href=\"#foundations\">Foundations<\u002Fa>\n      <a href=\"#components\">Components<\u002Fa>\n      <a href=\"#domain\">Domain<\u002Fa>\n      <a href=\"#templates\">Templates<\u002Fa>\n      <a href=\"#handover\">Handover<\u00 ink);\">\"Number expired. No SMS received. Refunded $0.65.\"<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div class=\"caption\" style=\"color: var(--danger); margin-bottom: 4px;\">✗ DON'T<\u002Fdiv>\n          <div class=\"body\" style=\"color: var(--ink-muted); text-decoration: line-through;\">\"Oops! Something went wrong 😅 Please try again.\"<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================\n     2 · FOUNDATIONS\n============================================================ -->\n<section id=\"foundations\" class=\"page section\">\n  <div class=\"section-head\">\n    <div class=\"left\">\n      <div class=\"eyebrow\">02 · Foundations<\u002Fdiv>\n      <h2 class=\"h2\">Tokens.<\u002Fh2>\n      <p class=\"body\">\n        Names map 1:1 to <code class=\"mono\">tailwind.config.ts<\u002Fcode> theme extensions and the\n        <code class=\"mono\">--background / --foreground / --primary<\u002Fcode> CSS variable pattern.\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Color: Surfaces -->\n  <h3 class=\"h4\" style=\"margin-bottom: 16px;\">Surfaces &amp; ink<\u002Fh3>\n  <div class=\"tokens\" style=\"margin-bottom: 40px;\">\n    <div class=\"tok span-3\"><div class=\"swatch\" style=\"background: var(--paper); border-color: var(--border);\"><\u002Fdiv><div class=\"nm\">paper<\u002Fdiv><div class=\"vl\">#FAF8F3 · --background<\u002Fdiv><\u002Fdiv>\n    <div class=\"tok span-3\"><div class=\"swatch\" style=\"background: var(--surface); border-color: var(--border);\"><\u002Fdiv><div class=\"nm\">surface<\u002Fdiv><div class=\"vl\">#FFFFFF · --card<\u002Fdiv><\u002Fdiv>\n    <div class=\"tok span-3\"><div class=\"swatch\" style=\"background: var(--subtle);\"><\u002Fdiv><div class=\"nm\">subtle<\u002Fdiv><div class=\"vl\">#F2EFE8 · --muted<\u002Fdiv><\u002Fdiv>\n    <div class=\"tok span-3\"><div class=\"swatch\" style=\"background: var(- n>: { <span class=\"n\">DEFAULT<\u002Fspan>: <span class=\"s\">\"#14110C\"<\u002Fspan>, <span class=\"s\">2<\u002Fspan>: <span class=\"s\">\"#3A3630\"<\u002Fspan>, <span class=\"n\">muted<\u002Fspan>: <span class=\"s\">\"#6B6558\"<\u002Fspan> },\n      },\n      <span class=\"n\">borderRadius<\u002Fspan>: {\n        <span class=\"n\">md<\u002Fspan>: <span class=\"s\">\"10px\"<\u002Fspan>, <span class=\"n\">lg<\u002Fspan>: <span class=\"s\">\"14px\"<\u002Fspan>, <span class=\"n\">xl<\u002Fspan>: <span class=\"s\">\"20px\"<\u002Fspan>,\n      },\n      <span class=\"n\">boxShadow<\u002Fspan>: {\n        <span class=\"n\">card<\u002Fspan>: <span class=\"s\">\"0 1px 0 rgba(20,17,12,.04), 0 1px 2px rgba(20,17,12,.04)\"<\u002Fspan>,\n        <span class=\"n\">glow<\u002Fspan>: <span class=\"s\">\"0 0 0 4px rgba(0,196,106,.14)\"<\u002Fspan>,\n      },\n    },\n  },\n  <span class=\"n\">plugins<\u002Fspan>: [<span class=\"k\">require<\u002Fspan>(<span class=\"s\">\"tailwindcss-animate\"<\u002Fspan>)],\n} <span class=\"k\">satisfies<\u002Fspan> <span class=\"n\">Config<\u002Fspan>;\n<\u002Fpre>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"g-2\">\n    <div class=\"card\">\n      <div class=\"eyebrow\" style=\"margin-bottom: 12px;\">RULES FOR CLAUDE CODE<\u002Fdiv>\n      <ol style=\"margin:0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; color: var(--ink-2); font-size: 14px; line-height: 1.55;\">\n        <li>Never put more than one accent (verification green) hue on the same screen. If everything is highlighted, nothing is.<\u002Fli>\n        <li>All numbers — phone numbers, codes, balances, prices, countdowns, order IDs — render in <code class=\"mono\">font-mono<\u002Fcode> with <code class=\"mono\">tabular-nums<\u002Fcode>.<\u002Fli>\n        <li>Use <code class=\"mono\">paper<\u002Fcode> as page background, <code class=\"mono\">surface<\u002Fcode> only for cards / dialogs / inputs. No gradients on surfaces.<\u002Fli>\n        <li>The wallet balance card is the one place the dark <code class=\"mono\">ink<\u002Fcode> background is allowed in user UI. Don't generalize it.<\u002Fli>\n        <li>OTP code reveal uses dark background + <code class=\"mono\">vg/300<\u002Fcode> code text — it's the screen everything builds toward, treat it as the visual climax.<\u002Fli>\n        <li>Status uses <span class=\"badge badge-success\" style=\"vertical-align: middle;\">badges<\u002Fspan> + dot indicators. Never colored backgrounds on whole rows.<\u002Fli>\n        <li>Border weight: 1px always. Never use 2px or thicker borders for emphasis — use shadow or contrast instead.<\u002Fli>\n        <li>Sentence case for all UI labels. No title case. No emoji. No exclamation marks anywhere.<\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n    <div class=\"card\">\n      <div class=\"eyebrow\" style=\"margin-bottom: 12px;\">FILE MAP<\u002Fdiv>\n      <pre class=\"code\" style=\"background: var(--subtle); color: var(--ink-2);\">components/\n├── ui/                    <span class=\"c\">// UI primitives, styled via tokens<\u002Fspan>\n│   ├── button.tsx\n│   ├── input.tsx\n│   ├── card.tsx\n│   ├── badge.tsx\n│   ├── dialog.tsx\n│   ├── table.tsx\n│   └── tabs.tsx\n├── brand/\n│   └── logo.tsx           <span class=\"c\">// \"v.\" mark + wordmark<\u002Fspan>\n├── wallet/\n│   ├── balance-card.tsx   <span class=\"c\">// dark hero card<\u002Fspan>\n│   ├── transaction-row.tsx\n│   └── topup-tile.tsx\n├── purchase/\n│   ├── service-grid.tsx\n│   ├── service-tile.tsx\n│   ├── country-list.tsx\n│   ├── country-row.tsx\n│   └── quote-card.tsx     <span class=\"c\">// 30s locked-quote bar<\u002Fspan>\n├── orders/\n│   ├── order-card.tsx\n│   ├── otp-reveal.tsx     <span class=\"c\">// the dark code-display block<\u002Fspan>\n│   ├── sms-bubble.tsx\n│   └── countdown.tsx      <span class=\"c\">// mono tabular timer<\u002Fspan>\n└── status/\n    ├── status-badge.tsx\n    └── provider-dot.tsx<\u002Fpre>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Definition of done -->\n  <div class=\"card\" style=\"margin-top: 24px;\">\n    <div class=\"eyebrow\" style=\"margin-bottom: 12px;\">DEFINITION OF \"VISUALLY DONE\" FOR PHASE 1<\u002Fdiv>\n    <div class=\"g-2\">\n      <ul style=\"margin:0; padding-left: 20px; color: var(--ink-2); font-size: 14px; line-height: 1.6;\">\n        <li>Brand sans loaded (Aeonik or General Sans) + JetBrains Mono.<\u002Fli>\n        <li>All four core screens render with paper background and the file-map components above.<\u002Fli>\n        <li>Wallet card uses ink background + verification-green accent.<\u002Fli>\n        <li>OTP reveal screen exists and is visually the most prominent block in the order detail page.<\u002Fli>\n        <li>Country &amp; service pickers use the two-column layout shown in the buy template.<\u002Fli>\n      <\u002Ful>\n      <ul style=\"margin:0; padding-left: 20px; color: var(--ink-2); font-size: 14px; line-height: 1.6;\">\n        <li>Status uses pill badges with a pulsing dot for live states.<\u002Fli>\n        <li>All numbers render in mono with tabular numerals.<\u002Fli>\n        <li>Empty / loading / error states follow the three-tile pattern.<\u002Fli>\n        <li>No gradient backgrounds, no emoji, no decorative iconography.<\u002Fli>\n        <li>Only one accent hue per screen. If unsure, leave it out.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================\n     FOOTER\n============================================================ -->\n<footer class=\"page foot\">\n  <span>Veridigits design system · v1.0 · 2026.05<\u002Fspan>\n  <span class=\"mono\">paper · ink · verification green · monospace numbers<\u002Fspan>\n<\u002Ffooter>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
